pluginManagement {
  // The package is installed in the mobile workspace, one directory above this Android project.
  includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins { id("com.facebook.react.settings") }

// React Native 0.74 uses the CLI-provided legacy autolinking settings API.
apply from: new File([
  "node",
  "--print",
  "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"
].execute(null, rootDir).text.trim(), "../native_modules.gradle")
applyNativeModulesSettingsGradle(settings)

rootProject.name = 'Noa'
include ':app'

// Make the React Native root-project plugin available to the top-level build.
includeBuild('../node_modules/@react-native/gradle-plugin')
