apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

static def versionToNumber(major, minor, patch) {
  return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
  def version = providers.exec {
    workingDir(projectDir)
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }
  return versionToNumber(major, minor, patch)
}
def rnVersion = getRNVersion()

react {
  entryFile = file("$projectRoot/index.js")
  reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
  hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
  codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

  if (rnVersion >= versionToNumber(0, 75, 0)) {
    autolinkLibrariesWithApp()
  }
}

def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()
def jscFlavor = 'org.webkit:android-jsc:+'

def releaseKeystorePath = System.getenv("NOA_ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("NOA_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("NOA_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("NOA_ANDROID_KEY_PASSWORD")
def releaseSigningEnvironment = [
  "NOA_ANDROID_KEYSTORE_PATH": releaseKeystorePath,
  "NOA_ANDROID_KEYSTORE_PASSWORD": releaseKeystorePassword,
  "NOA_ANDROID_KEY_ALIAS": releaseKeyAlias,
  "NOA_ANDROID_KEY_PASSWORD": releaseKeyPassword,
]
def releaseSigningConfigured = releaseSigningEnvironment.values().every { value ->
  value != null && !value.trim().isEmpty()
}
def releaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
  taskName.toLowerCase().contains("release")
}

if (releaseBuildRequested) {
  releaseSigningEnvironment.each { name, value ->
    if (value == null || value.trim().isEmpty()) {
      throw new GradleException("Missing required environment variable ${name} for release signing.")
    }
  }

  def releaseKeystoreFile = file(releaseKeystorePath)
  if (!releaseKeystoreFile.isFile() || !releaseKeystoreFile.canRead()) {
    throw new GradleException("NOA_ANDROID_KEYSTORE_PATH must point to a readable release keystore.")
  }
}

android {
  ndkVersion rootProject.ext.ndkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdk rootProject.ext.compileSdkVersion

  namespace 'com.noa.mobile'
  defaultConfig {
    applicationId 'com.noa.mobile'
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 22
    versionName "2.2.0"
    ndk {
      abiFilters "arm64-v8a"
    }
  }
  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    release {
      if (releaseSigningConfigured) {
        storeFile file(releaseKeystorePath)
        storePassword releaseKeystorePassword
        keyAlias releaseKeyAlias
        keyPassword releaseKeyPassword
      }
    }
  }
  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      signingConfig signingConfigs.release
      shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
      minifyEnabled enableProguardInReleaseBuilds
      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
      crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
    }
  }
}

["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
  def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",")
  for (i in 0..<options.size()) options[i] = options[i].trim()
  options -= ""
  if (options.length > 0) {
    options.each { android.packagingOptions[prop] += it }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }
}

if (rnVersion < versionToNumber(0, 75, 0)) {
  apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle")
  applyNativeModulesAppBuildGradle(project)
}
