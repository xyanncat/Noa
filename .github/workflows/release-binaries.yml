name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  prepare:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require a matching semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name }}'
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version prefixed with v (for example v2.2.0)." >&2
            exit 1
          fi

          version="${tag#v}"
          node -e 'const fs = require("fs"); const expected = process.argv[1]; const versions = { root: require("./package.json").version, mobile: require("./mobile/app.json").expo.version, tauri: require("./desktop-windows/src-tauri/tauri.conf.json").version, cargo: (fs.readFileSync("./desktop-windows/src-tauri/Cargo.toml", "utf8").match(/\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m) || [])[1] }; const mismatches = Object.entries(versions).filter(([, actual]) => actual !== expected); if (mismatches.length) { console.error(`Release tag v${expected} does not match: ${mismatches.map(([name, actual]) => `${name}=${actual}`).join(", ")}`); process.exit(1); }' "$version"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Build signed Android APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked JavaScript dependencies
        run: npm ci --include=dev --include-workspace-root

      - name: Materialize release keystore
        shell: bash
        env:
          NOA_ANDROID_KEYSTORE_BASE64: ${{ secrets.NOA_ANDROID_KEYSTORE_BASE64 }}
          NOA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NOA_ANDROID_KEYSTORE_PASSWORD }}
          NOA_ANDROID_KEY_ALIAS: ${{ secrets.NOA_ANDROID_KEY_ALIAS }}
          NOA_ANDROID_KEY_PASSWORD: ${{ secrets.NOA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${NOA_ANDROID_KEYSTORE_BASE64:?Set the NOA_ANDROID_KEYSTORE_BASE64 repository secret.}"
          : "${NOA_ANDROID_KEYSTORE_PASSWORD:?Set the NOA_ANDROID_KEYSTORE_PASSWORD repository secret.}"
          : "${NOA_ANDROID_KEY_ALIAS:?Set the NOA_ANDROID_KEY_ALIAS repository secret.}"
          : "${NOA_ANDROID_KEY_PASSWORD:?Set the NOA_ANDROID_KEY_PASSWORD repository secret.}"

          keystore="$RUNNER_TEMP/noa-release.jks"
          printf '%s' "$NOA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"

          echo "NOA_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "NOA_ANDROID_KEYSTORE_PASSWORD=$NOA_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NOA_ANDROID_KEY_ALIAS=$NOA_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NOA_ANDROID_KEY_PASSWORD=$NOA_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Assemble signed arm64 release APK
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Stage Android release asset
        shell: bash
        run: |
          set -euo pipefail
          source_apk='mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -f "$source_apk"
          mkdir -p release-assets
          cp "$source_apk" "release-assets/Noa-${{ needs.prepare.outputs.tag }}-Android-arm64.apk"

      - name: Preserve Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-binary
          path: release-assets/Noa-${{ needs.prepare.outputs.tag }}-Android-arm64.apk
          if-no-files-found: error

  windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install locked JavaScript dependencies
        run: npm ci --include=dev --include-workspace-root

      - name: Build offline NSIS installer
        run: npm run desktop:build

      - name: Stage Windows release asset
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'desktop-windows/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Tauri did not create an NSIS setup executable.'
          }

          New-Item -ItemType Directory -Force -Path 'release-assets' | Out-Null
          Copy-Item $installer.FullName 'release-assets/Noa-${{ needs.prepare.outputs.tag }}-Windows-x64-Setup.exe'

      - name: Preserve Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-binary
          path: release-assets/Noa-${{ needs.prepare.outputs.tag }}-Windows-x64-Setup.exe
          if-no-files-found: error

  publish:
    name: Attach binaries to GitHub Release
    needs: [prepare, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-binary"
          merge-multiple: true
          path: release-assets

      - name: Upload binaries to the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            release-assets/*.apk \
            release-assets/*.exe \
            --clobber
